<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLC Unlimited</title>
<meta name="description" content="SLC Unlimited helps businesses find hidden revenue they're already sitting on.">
<style>
  :root { --ink:#1a1d21; --paper:#fafaf8; --accent:#0d5c46; --muted:#6b7075; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background:var(--paper); color:var(--ink);
         min-height:100svh; display:flex; align-items:center; justify-content:center; padding:2rem; }
  main { max-width:34rem; width:100%; }
  .mark { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight:700;
          font-size:0.95rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); }
  h1 { font-size:clamp(1.9rem, 5vw, 2.6rem); line-height:1.15; font-weight:400; margin:1.1rem 0 1.4rem; }
  p  { font-size:1.05rem; line-height:1.6; color:var(--muted); max-width:30rem; }
  .contact { margin-top:2.2rem; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
             font-size:0.95rem; line-height:1.9; }
  .contact a { color:var(--ink); text-decoration:none; border-bottom:1px solid #c9ccc9; padding-bottom:1px; }
  .contact a:hover { border-color:var(--accent); color:var(--accent); }
  hr { border:none; border-top:1px solid #e3e5e2; margin:2.2rem 0 0; max-width:6rem; }
</style>
</head>
<body>
<main>
  <div class="mark">SLC Unlimited</div>
  <h1>Helping businesses find hidden revenue they're already sitting on.</h1>
  <p>US-based. We look at what happens between a customer's first contact and the sale, and find where money is quietly slipping out.</p>
  <hr>
  <div class="contact">
    Steven Hamberlin<br>
    <a href="tel:+16026925808">602.692.5808</a><br>
    <a href="mailto:steven@slcunlimited.app">steven@slcunlimited.app</a>
  </div>
</main>
</body>
</html>
